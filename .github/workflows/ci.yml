name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: newpassword
          MYSQL_DATABASE: capella_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pnewpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: mysql://root:newpassword@127.0.0.1:3306/capella_test
      DATABASE_URL: mysql://root:newpassword@127.0.0.1:3306/capella_test
      NEXT_PUBLIC_API_URL: http://localhost:4000
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      COOKIE_SECURE: "false"
      ADMIN_NAME: CI Admin
      ADMIN_EMAIL: ci-admin@capella.eg
      ADMIN_PASSWORD: ci-admin-password
      STOREFRONT_REVALIDATE_SECRET: ci-revalidate-secret
      HOSTINGER_PUBLIC_BASE_URL: http://localhost/uploads

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run test database migrations
        run: pnpm --filter @capella/database run pretest

      - name: Test
        run: pnpm test
