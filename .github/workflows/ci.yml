name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: newpassword
          MYSQL_DATABASE: capella_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pnewpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: mysql://root:newpassword@127.0.0.1:3306/capella_test
      DATABASE_URL: mysql://root:newpassword@127.0.0.1:3306/capella_test
      NEXT_PUBLIC_API_URL: http://localhost:4000
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ALLOW_DEV_ADMIN_FALLBACK: "true"
      DEV_ADMIN_EMAIL: admin@capella.eg
      DEV_ADMIN_PASSWORD: admin1234
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
