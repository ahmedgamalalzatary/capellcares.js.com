name: Staging Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - release/**

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
      STAGING_PRODUCT_SLUG: ${{ secrets.STAGING_PRODUCT_SLUG }}
      STAGING_OUT_OF_STOCK_PRODUCT_SLUG: ${{ secrets.STAGING_OUT_OF_STOCK_PRODUCT_SLUG }}
      STAGING_OUT_OF_STOCK_OFFER_SLUG: ${{ secrets.STAGING_OUT_OF_STOCK_OFFER_SLUG }}
      STAGING_EXISTING_CUSTOMER_EMAIL: ${{ secrets.STAGING_EXISTING_CUSTOMER_EMAIL }}
      STAGING_EXISTING_CUSTOMER_PHONE: ${{ secrets.STAGING_EXISTING_CUSTOMER_PHONE }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run staging smoke suite
        run: pnpm test:staging-smoke
